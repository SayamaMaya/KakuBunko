<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>架空文庫メーカー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }
        .rounded-panel {
            border-radius: 2.5rem;
        }
        .preview-area {
            min-height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(#ccc 1px, transparent 1px);
            background-size: 24px 24px;
            border-radius: 2rem;
        }
        #spineCanvas {
            display: none;
        }
        #previewImage {
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            max-width: 95%;
            height: auto;
            border-radius: 2px;
            display: block;
        }
        .option-group {
            background: #f9f9f9;
            padding: 1.25rem;
            border-radius: 1.5rem;
        }
        .color-dot {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 0 0 1px #ddd;
            transition: transform 0.2s;
        }
        .color-dot:hover {
            transform: scale(1.1);
        }
        .color-dot.active {
            box-shadow: 0 0 0 2px #000;
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <!-- 設定パネル -->
        <div class="bg-white rounded-panel p-8 shadow-sm border border-gray-100 space-y-6">
            <header>
                <h1 class="text-3xl font-bold tracking-tighter text-black">架空文庫メーカー</h1>
                <p class="text-sm text-gray-500 mt-2 font-medium">本の背表紙をデザインして保存</p>
            </header>

            <div class="space-y-5">
                <div class="option-group">
                    <label class="block text-sm font-bold mb-2">本のタイトル</label>
                    <textarea id="bookTitle" class="w-full px-4 py-3 bg-white rounded-xl outline-none text-lg leading-relaxed border-2 border-transparent focus:border-black transition-all" rows="2">瓦礫の山にあなたの名前の花を植えること</textarea>
                </div>

                <div class="option-group">
                    <label class="block text-sm font-bold mb-2">作者名</label>
                    <input type="text" id="bookAuthor" class="w-full px-4 py-3 bg-white rounded-xl outline-none text-md border-2 border-transparent focus:border-black transition-all" placeholder="著者名を入力" value="さやま まや">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="option-group">
                        <label class="block text-sm font-bold mb-2">書体</label>
                        <select id="fontFamily" class="w-full bg-white px-2 py-2 rounded-lg outline-none cursor-pointer">
                            <option value="'Zen Maru Gothic'">丸ゴシック</option>
                            <option value="'Noto Sans JP'">角ゴシック</option>
                            <option value="'Noto Serif JP'">明朝体</option>
                        </select>
                    </div>
                    <div class="option-group">
                        <label class="block text-sm font-bold mb-2">太さ</label>
                        <select id="fontWeight" class="w-full bg-white px-2 py-2 rounded-lg outline-none cursor-pointer">
                            <option value="400">標準</option>
                            <option value="700" selected>太字</option>
                        </select>
                    </div>
                </div>

                <div class="option-group">
                    <label class="block text-sm font-bold mb-3">背表紙の色</label>
                    <div class="flex flex-wrap gap-3" id="colorPicker"></div>
                </div>

                <button id="generateBtn" class="w-full bg-black text-white font-bold py-5 rounded-2xl hover:opacity-80 active:scale-[0.98] transition-all shadow-xl text-lg">
                    デザインを更新する
                </button>
            </div>
        </div>

        <!-- プレビュー -->
        <div class="flex flex-col gap-6">
            <div class="preview-area bg-gray-100 border border-gray-200 p-8">
                <canvas id="spineCanvas"></canvas>
                <img id="previewImage" alt="背表紙プレビュー" class="hidden">
                <div id="placeholder" class="text-gray-400 font-bold">デザインを更新してください</div>
            </div>
            
            <div id="downloadArea" class="hidden space-y-3">
                <button id="saveBtn" class="w-full bg-white border-2 border-black text-black font-bold py-5 rounded-2xl hover:bg-black hover:text-white transition-all shadow-md text-lg">
                    画像を保存する
                </button>
                <button id="shareXBtn" class="w-full bg-[#000000] text-white font-bold py-5 rounded-2xl hover:opacity-90 transition-all shadow-md text-lg flex items-center justify-center gap-2">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path></svg>
                    保存した画像を X でポスト
                </button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('spineCanvas');
        const ctx = canvas.getContext('2d');
        const previewImg = document.getElementById('previewImage');
        const titleInput = document.getElementById('bookTitle');
        const authorInput = document.getElementById('bookAuthor');
        const fontSelect = document.getElementById('fontFamily');
        const weightSelect = document.getElementById('fontWeight');
        const generateBtn = document.getElementById('generateBtn');
        const saveBtn = document.getElementById('saveBtn');
        const shareXBtn = document.getElementById('shareXBtn');
        const downloadArea = document.getElementById('downloadArea');
        const placeholder = document.getElementById('placeholder');
        const colorPicker = document.getElementById('colorPicker');

        const colors = [
            { hex: '#FFFFFF' }, { hex: '#F9F9F9' }, { hex: '#E5E7EB' },
            { hex: '#FEF3C7' }, 
            { hex: '#C7F0F5' },
            { hex: '#DBEAFE' },
            { hex: '#FCE7F3' }, { hex: '#F5F5DC' },
            { hex: '#E0D7FF' },
            { hex: '#FFD7D7' }
        ];

        let selectedColor = '#FFFFFF';

        colors.forEach((color, i) => {
            const dot = document.createElement('div');
            dot.className = `color-dot ${i === 0 ? 'active' : ''}`;
            dot.style.backgroundColor = color.hex;
            dot.onclick = () => {
                document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
                dot.classList.add('active');
                selectedColor = color.hex;
                draw();
            };
            colorPicker.appendChild(dot);
        });

        function drawVerticalText(text, x, startY, fontSize, spacing, fontFamily, weight) {
            ctx.font = `${weight} ${fontSize}px ${fontFamily}`;
            const chars = text.split('');
            chars.forEach((char, i) => {
                const y = startY + (i * (fontSize + spacing));
                const rotateChars = ['ー', '―', '-', '～', '「', '」', '（', '）', '『', '』', '、', '。'];
                if (rotateChars.includes(char)) {
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.rotate(Math.PI / 2);
                    ctx.fillText(char, 0, 0);
                    ctx.restore();
                } else {
                    ctx.fillText(char, x, y);
                }
            });
            return chars.length * (fontSize + spacing);
        }

        function draw() {
            const title = titleInput.value.trim() || '無題';
            const author = authorInput.value.trim() || '';
            const fontFamily = fontSelect.value;
            const fontWeight = weightSelect.value;
            
            const titleFontSize = 30;
            const authorFontSize = 18;
            const spacing = 8;
            const groupGap = 60;
            const marginY = 100;
            const spineWidth = 140;

            const titleHeight = title.length * (titleFontSize + spacing);
            const authorHeight = author ? author.length * (authorFontSize + spacing) : 0;
            const totalContentHeight = titleHeight + (author ? groupGap + authorHeight : 0);
            const canvasHeight = Math.max(600, totalContentHeight + marginY * 2);

            canvas.width = spineWidth;
            canvas.height = canvasHeight;

            ctx.fillStyle = selectedColor;
            ctx.fillRect(0, 0, spineWidth, canvasHeight);

            const grad = ctx.createLinearGradient(0, 0, spineWidth, 0);
            grad.addColorStop(0, 'rgba(0,0,0,0.06)');
            grad.addColorStop(0.2, 'rgba(0,0,0,0)');
            grad.addColorStop(0.8, 'rgba(0,0,0,0)');
            grad.addColorStop(1, 'rgba(0,0,0,0.1)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, spineWidth, canvasHeight);

            ctx.strokeStyle = '#999';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(35, 55); ctx.lineTo(spineWidth - 35, 55); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(35, canvasHeight - 55); ctx.lineTo(spineWidth - 35, canvasHeight - 55); ctx.stroke();

            ctx.fillStyle = '#000';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const contentStartY = (canvasHeight / 2) - (totalContentHeight / 2);
            drawVerticalText(title, spineWidth / 2, contentStartY + (titleFontSize / 2), titleFontSize, spacing, fontFamily, fontWeight);

            if (author) {
                const authorStartY = contentStartY + titleHeight + groupGap;
                drawVerticalText(author, spineWidth / 2, authorStartY + (authorFontSize / 2), authorFontSize, spacing, fontFamily, 400);
            }

            ctx.fillStyle = '#666';
            ctx.font = `400 12px ${fontFamily}`;
            ctx.fillText('架空文庫', spineWidth / 2, canvasHeight - 40);

            previewImg.src = canvas.toDataURL('image/png');
            previewImg.classList.remove('hidden');
            placeholder.classList.add('hidden');
            downloadArea.classList.remove('hidden');
        }

        saveBtn.onclick = () => {
            const link = document.createElement('a');
            link.download = `架空文庫背表紙-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        };

        shareXBtn.onclick = () => {
            const title = titleInput.value.trim();
            const author = authorInput.value.trim();
            // ポスト形式を修正: ハッシュタグ、タイトル、著者の順
            const text = `#架空文庫メーカー\n『${title}』\n著者：${author} \nhttps://sayamamaya.github.io/KakuBunko/`;
            const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        };

        generateBtn.onclick = draw;
        window.onload = () => {
            document.fonts.ready.then(() => draw());
        };
    </script>
</body>
</html>
